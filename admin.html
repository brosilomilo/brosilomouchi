<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROSiLO Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #ffb300; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .admin-card { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        h1 { margin-bottom: 10px; font-size: 24px; color: #333; }
        p { margin-bottom: 15px; color: #666; font-size: 14px; }
        .status-badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 18px; margin: 15px 0 25px; }
        .btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; transition: 0.2s ease; }
        .btn-open { background: #26971b; }
        .btn-close { background: #d70032; }
        .btn-logout { background: #555; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        input[type="password"] { width: 100%; padding: 14px; font-size: 16px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 12px; outline: none; text-align: center; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div class="admin-card" id="login-section">
        <h1>BROSiLO MOUCHi</h1>
        <p>Login Admin Panel</p>
        <input type="password" id="admin-password" placeholder="Masukkan Password...">
        <button class="btn btn-open" id="btn-login">Masuk</button>
    </div>

    <!-- HALAMAN PANEL Kontrol (Disembunyikan Sebelum Login) -->
    <div class="admin-card" id="dashboard-section" style="display: none;">
        <h1>BROSiLO MOUCHi</h1>
        <p>Control Panel Toko</p>
        
        <div id="status-badge" class="status-badge" style="background: #eee; color: #666;">Memuat...</div>

        <button class="btn btn-open" id="btn-open">BUKA TOKO (OPEN)</button>
        <button class="btn btn-close" id="btn-close">TUTUP TOKO (CLOSE)</button>
        <button class="btn btn-logout" id="btn-logout">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDTf3da_pvH0cWCcp3LZlAKo8Byj60BzNU",
            authDomain: "brosilomouchi.firebaseapp.com",
            databaseURL: "https://brosilomouchi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "brosilomouchi",
            storageBucket: "brosilomouchi.firebasestorage.app",
            messagingSenderId: "553620321746",
            appId: "1:553620321746:web:aec6a279a7e6b2b6f7840b",
            measurementId: "G-FQ6MFKF6BT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'storeStatus');

        // Ganti password admin di sini sesuai keinginanmu
        const ADMIN_PASSWORD = "panyuri234@";

        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const passwordInput = document.getElementById('admin-password');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');

        // Proses Login
        btnLogin.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                loginSection.style.display = 'none';
                dashboardSection.style.display = 'block';
            } else {
                alert('Password salah, Cuy!');
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // Proses Logout
        btnLogout.addEventListener('click', () => {
            dashboardSection.style.display = 'none';
            loginSection.style.display = 'block';
            passwordInput.value = '';
        });

        // Monitoring status toko secara realtime di halaman admin
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            const badge = document.getElementById('status-badge');
            if (data && data.isOpen) {
                badge.innerText = "TOKO BUKA (OPEN)";
                badge.style.background = "#e8f5e9";
                badge.style.color = "#26971b";
            } else {
                badge.innerText = "TOKO TUTUP (CLOSE)";
                badge.style.background = "#ffebee";
                badge.style.color = "#d70032";
            }
        });

        // Event Tombol Ubah Status ke Database
        document.getElementById('btn-open').addEventListener('click', () => {
            set(statusRef, { isOpen: true });
        });

        document.getElementById('btn-close').addEventListener('click', () => {
            set(statusRef, { isOpen: false });
        });
    </script>
</body>
</html>
