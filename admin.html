<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROSiLO Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #ffb300; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .admin-card { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 20px rgba(0,0,0,0.15); margin-top: 8vh; }
        .admin-card.wide { max-width: 900px; margin-top: 0; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #333; }
        h2 { font-size: 18px; margin: 20px 0 10px; text-align: left; color: #333; }
        p { margin-bottom: 15px; color: #666; font-size: 14px; }
        .status-badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 18px; margin: 10px 0 15px; }
        .btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; transition: 0.2s ease; }
        .btn-open { background: #26971b; }
        .btn-close { background: #d70032; }
        .btn-del { background: #999; }
        .btn-print { background: #0288d1; }
        .btn:active { transform: scale(0.98); }
        .row { display: flex; gap: 10px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; border: 2px solid #ddd; background: #fff; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .tab.active { background: #ffb300; border-color: #ffb300; }
        .order { text-align: left; border: 2px solid #eee; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
        .order-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        
        /* ID PESANAN DIBUAT PALING BESAR DAN MENONJOL */
        .order-no { font-weight: 900; font-size: 28px; color: #d70032; letter-spacing: 1px; }

        .pill { padding: 4px 12px; border-radius: 14px; font-size: 13px; font-weight: bold; background: #fff3e0; color: #e65100; }
        .s-VerifikasiPembayaran { background: #fff9c4; color: #f57f17; }
        .s-Menunggu { background: #e8f5e9; color: #26971b; }
        .s-Diproses { background: #e3f2fd; color: #1565c0; }
        .s-MenungguKirim { background: #f3e5f5; color: #7b1fa2; }
        .s-SedangDikirim { background: #e0f2f1; color: #00695c; }
        .s-Selesai { background: #e8f5e9; color: #26971b; }
        .s-Dibatalkan, .s-Ditolak { background: #ffebee; color: #d70032; }
        .order ul { margin: 8px 0 8px 20px; font-size: 14px; color: #444; }
        .order small { color: #888; }
        .order .btn { margin: 10px 0 0; padding: 11px; font-size: 15px; }
        .empty { color: #888; padding: 20px; }
        .fb-item { text-align: left; border: 2px solid #eee; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
        .fb-msg { white-space: pre-wrap; word-break: break-word; font-size: 15px; color: #333; margin-bottom: 8px; }
        .fb-item .btn { margin: 8px 0 0; padding: 10px; font-size: 14px; }
        .badge-n { display: inline-block; min-width: 24px; padding: 2px 8px; border-radius: 12px; background: #d70032; color: #fff; font-size: 13px; vertical-align: middle; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- LOGIN ADMIN -->
    <div class="admin-card" id="login-section">
        <h1>BROSiLO MOUCHi</h1>
        <p>Login Admin</p>
        <input type="text" id="admin-user" placeholder="Username" autocomplete="username" autocapitalize="none" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px;">
        <input type="password" id="admin-pass" placeholder="Password" autocomplete="current-password" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px;">
        <p id="login-msg" style="color: #d70032;"></p>
        <button class="btn btn-open" id="btn-login">Masuk Dashboard</button>
    </div>

    <!-- DASHBOARD -->
    <div class="admin-card wide hidden" id="dashboard-section">
        <h1>BROSiLO MOUCHi</h1>
        <p>Control Panel Toko <a href="#" id="btn-logout" style="color:#d70032;">(Keluar)</a></p>

        <div id="status-badge" class="status-badge" style="background: #eee; color: #666;">Memuat...</div>
        <div class="row">
            <button class="btn btn-open" id="btn-open">BUKA TOKO</button>
            <button class="btn btn-close" id="btn-close">TUTUP TOKO</button>
        </div>

        <h2>Pesanan Masuk</h2>
        <div class="tabs">
            <button class="tab active" data-filter="aktif">Aktif</button>
            <button class="tab" data-filter="selesai">Selesai</button>
            <button class="tab" data-filter="semua">Semua</button>
        </div>
        <button class="btn btn-del" id="btn-clear" style="display: none; margin-bottom: 15px;">Hapus Semua Pesanan Selesai</button>
        <div id="orders-list"><div class="empty">Memuat pesanan...</div></div>

        <h2>Saran &amp; Kritik <span class="badge-n" id="fb-total">0</span></h2>
        <button class="btn btn-del" id="btn-fb-clear" style="display: none; margin-bottom: 15px;">Hapus Semua Saran</button>
        <div id="feedback-list"><div class="empty">Memuat saran...</div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTf3da_pvH0cWCcp3LZlAKo8Byj60BzNU",
            authDomain: "brosilomouchi.firebaseapp.com",
            databaseURL: "https://brosilomouchi-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "brosilomouchi",
            storageBucket: "brosilomouchi.firebasestorage.app",
            messagingSenderId: "553620321746",
            appId: "1:553620321746:web:aec6a279a7e6b2b6f7840b",
            measurementId: "G-FQ6MFKF6BT"
        };

        // App KHUSUS ADMIN (nama 'admin-panel'): sesi loginnya terpisah dari index.html,
        // jadi login pembeli (Google) dan login admin nggak saling timpa.
        const app = initializeApp(firebaseConfig, 'admin-panel');
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Username diubah jadi email internal (Firebase Auth butuh format email).
        // Akun adminnya dibuat di Firebase Console dengan email: <username>@admin.brosilomouchi.app
        const ADMIN_DOMAIN = '@admin.brosilomouchi.app';
        const statusRef = ref(db, 'storeStatus');

        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
        const FINAL = ['Selesai', 'Dibatalkan', 'Ditolak'];

        // ---------- LOGIN ADMIN (USERNAME + PASSWORD) ----------
        async function handleLogin() {
            const username = $('admin-user').value.trim().toLowerCase();
            const pass = $('admin-pass').value;
            if (!username || !pass) {
                $('login-msg').innerText = 'Username dan password tidak boleh kosong!';
                return;
            }
            $('btn-login').disabled = true;
            $('btn-login').innerText = 'Memeriksa...';
            $('login-msg').innerText = '';
            try {
                await signInWithEmailAndPassword(auth, username + ADMIN_DOMAIN, pass);
                $('admin-pass').value = '';
                // tampilan dashboard diatur oleh onAuthStateChanged di bawah
            } catch (e) {
                $('login-msg').innerText = e.code === 'auth/too-many-requests'
                    ? 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.'
                    : e.code === 'auth/network-request-failed'
                        ? 'Koneksi bermasalah, coba lagi.'
                        : 'Username atau password salah!';
            } finally {
                $('btn-login').disabled = false;
                $('btn-login').innerText = 'Masuk Dashboard';
            }
        }

        $('btn-login').addEventListener('click', handleLogin);
        ['admin-user', 'admin-pass'].forEach(id => $(id).addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        }));

        $('btn-logout').addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth);
        });

        // ---------- STATUS TOKO ----------
        $('btn-open').addEventListener('click', () => set(statusRef, { isOpen: true }));
        $('btn-close').addEventListener('click', () => set(statusRef, { isOpen: false }));

        // ---------- PESANAN ----------
        let orders = [], filter = 'aktif', unsubs = [];

        function actions(o) {
            const pickup = o.method === 'Dijemput';
            const reject = { label: 'Tolak Pesanan', cls: 'btn-close', next: 'Ditolak', reason: true,
                confirm: 'Tolak pesanan ' + o.orderNo + '?' + (['Menunggu', 'Diproses'].includes(o.status) ? ' (Jangan lupa refund jika sudah bayar.)' : '') };
            switch (o.status) {
                case 'Menunggu Pembayaran': return [reject];
                case 'Verifikasi Pembayaran': return [
                    { label: 'Pembayaran Valid ✓', cls: 'btn-open', next: 'Menunggu', extra: { paidAt: Date.now() }, confirm: 'Uang ' + rp(o.total) + ' untuk ' + o.orderNo + ' sudah masuk?' },
                    { label: 'Pembayaran Tidak Ditemukan', cls: 'btn-del', next: 'Menunggu Pembayaran', extra: { paymentNote: 'Pembayaran belum ditemukan / tidak sesuai.' }, confirm: 'Kembalikan?' },
                    reject
                ];
                case 'Menunggu': return [{ label: 'Proses Pesanan', cls: 'btn-open', next: 'Diproses' }, reject];
                case 'Diproses': return [{ label: 'Pesanan Siap → ' + (pickup ? 'Siap Diambil' : 'Menunggu Kirim'), cls: 'btn-open', next: 'Menunggu Kirim', confirm: 'Pesanan ' + o.orderNo + ' selesai dibuat?' }, reject];
                case 'Menunggu Kirim': return [pickup
                    ? { label: 'Sudah Diambil → Selesai', cls: 'btn-open', next: 'Selesai', confirm: 'Pesanan ' + o.orderNo + ' sudah diambil?' }
                    : { label: 'Mulai Kirim', cls: 'btn-open', next: 'Sedang Dikirim', confirm: 'Mulai kirim pesanan ' + o.orderNo + '?' }];
                case 'Sedang Dikirim': return [{ label: 'Sudah Sampai → Selesai', cls: 'btn-open', next: 'Selesai', confirm: 'Pesanan ' + o.orderNo + ' sudah sampai?' }];
                default: return [];
            }
        }

        const waLink = (p) => 'https://wa.me/' + String(p || '').replace(/\D/g, '').replace(/^0/, '62');

        function render() {
            const list = orders.filter(o => filter === 'semua' ? true : filter === 'selesai' ? FINAL.includes(o.status) : !FINAL.includes(o.status));
            const box = $('orders-list');
            $('btn-clear').style.display = (filter === 'selesai' && list.length) ? 'block' : 'none';
            if (!list.length) { box.innerHTML = '<div class="empty">Belum ada pesanan.</div>'; return; }

            box.innerHTML = list.map(o => {
                const items = Object.values(o.items || {}).map(i => `<li>${esc(i.name)} (${esc(i.qty)}x)</li>`).join('');
                const time = new Date(o.createdAt).toLocaleString('id-ID');
                const label = o.status === 'Menunggu Kirim' && o.method === 'Dijemput' ? 'Siap Diambil' : o.status === 'Menunggu' ? 'Sudah Dibayar' : o.status;
                const pay = o.payment ? `<div style="font-size:14px; margin-top:6px;">💳 ${esc(o.payment.method)} • pengirim: <strong>${esc(o.payment.payer)}</strong></div>` : '';
                const btns = actions(o).map((a, i) => `<button class="btn ${a.cls}" data-no="${esc(o.orderNo)}" data-i="${i}">${esc(a.label)}</button>`).join('');
                
                return `
                <div class="order">
                    <div class="order-head">
                        <span class="order-no">${esc(o.orderNo)}</span>
                        <span class="pill s-${esc(o.status.replace(/ /g, ''))}">${esc(label)}</span>
                    </div>
                    <div><strong>${esc(o.name)}</strong> | ${esc(o.method)}${o.email ? ' | <small>' + esc(o.email) + '</small>' : ''}</div>
                    ${o.phone ? `<div style="margin-top:4px;">📱 <a href="${waLink(o.phone)}" target="_blank" rel="noopener">${esc(o.phone)}</a></div>` : ''}
                    ${o.pickupPoint ? `<div style="margin-top:4px;">📍 Jemput: <strong>${esc(o.pickupPoint)}</strong></div>` : ''}
                    <ul>${items}</ul>
                    <div><strong>Total: ${rp(o.total)}</strong>${o.shipping ? ' <small>(termasuk ongkir ' + rp(o.shipping) + ')</small>' : ''} <small>• ${esc(time)}</small></div>
                    ${pay}
                    ${o.rejectReason ? `<small>Alasan: ${esc(o.rejectReason)}</small>` : ''}
                    <button class="btn btn-print" data-print="${esc(o.orderNo)}" style="background: #0288d1; margin-top: 10px;">Cetak Struk Pesanan</button>
                    ${btns}
                    ${FINAL.includes(o.status) ? `<button class="btn btn-del" data-no="${esc(o.orderNo)}" data-i="del">Hapus</button>` : ''}
                </div>`;
            }).join('');
        }

        // ---------- SARAN & KRITIK (ANONIM) ----------
        let feedbacks = [];

        function renderFeedback() {
            $('fb-total').innerText = feedbacks.length;
            $('btn-fb-clear').style.display = feedbacks.length ? 'block' : 'none';
            const box = $('feedback-list');
            if (!feedbacks.length) { box.innerHTML = '<div class="empty">Belum ada saran atau kritik.</div>'; return; }
            box.innerHTML = feedbacks.map(f => `
                <div class="fb-item">
                    <div class="fb-msg">${esc(f.message)}</div>
                    <small style="color:#888;">${esc(new Date(f.createdAt).toLocaleString('id-ID'))}</small>
                    <button class="btn btn-del" data-fb="${esc(f.id)}">Hapus</button>
                </div>`).join('');
        }

        $('feedback-list').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-fb]');
            if (!btn) return;
            if (!confirm('Hapus saran ini secara permanen?')) return;
            try { await remove(ref(db, 'feedback/' + btn.dataset.fb)); } catch (err) { alert('Gagal menghapus: ' + err.message); }
        });

        $('btn-fb-clear').addEventListener('click', async () => {
            if (!feedbacks.length) return;
            if (!confirm('Hapus SEMUA saran & kritik (' + feedbacks.length + ')?')) return;
            try { await remove(ref(db, 'feedback')); } catch (err) { alert('Gagal menghapus: ' + err.message); }
        });

        // FUNGSI CETAK FORMAT STRUK KASIR THERMAL (INSTAN & LANCAR)
        document.addEventListener('click', (e) => {
            const printBtn = e.target.closest('button[data-print]');
            if (printBtn) {
                const orderNo = printBtn.dataset.print;
                const o = orders.find(x => x.orderNo === orderNo);
                if (!o) return;

                const printWindow = window.open('', '_blank', 'width=300,height=600');
                
                const itemsHtml = Object.values(o.items || {}).map(i => `
                    <div class="row">
                        <span class="nm">${esc(i.name)} (${esc(i.qty)}x)</span>
                        <span class="pr">${rp(i.price * i.qty)}</span>
                    </div>
                `).join('');

                printWindow.document.write(`
                    <html>
                    <head>
                        <title>Cetak Struk - ${esc(o.orderNo)}</title>
                        <style>
                            @page { size: 58mm auto; margin: 0; }
                            * { box-sizing: border-box; }
                            html { width: 100%; }
                            /* Lebar area cetak thermal 58mm = +-48mm, jadi dibatasi 48mm & ditaruh di tengah */
                            body { font-family: 'Courier New', Courier, monospace; width: 48mm; margin: 0 auto; padding: 4mm 1mm; color: #000; font-size: 10px; font-weight: bold; }
                            .center { text-align: center; }
                            .line { border-top: 2px dashed #000; margin: 8px 0; }
                            .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
                            .row .nm { flex: 1 1 auto; min-width: 0; word-break: break-word; }
                            .row .pr { flex: 0 0 auto; white-space: nowrap; text-align: right; }
                            .idbox { border: 3px solid #000; padding: 4px 2px; margin: 4px 0; text-align: center; }
                            .idbox small { display: block; font-size: 13px; }
                            .idbox b { display: block; font-size: 20px; line-height: 1.1; letter-spacing: 1px; word-break: break-all; }
                            .total { font-size: 12px; }
                        </style>
                    </head>
                    <body>
                        <div class="center" style="font-size: 15px;">BROSiLO MOUCHi</div>
                        <div class="center" style="font-size: 10px;">Pre-Order Mochi</div>
                        <div class="line"></div>
                        <div class="idbox"><small>ID PESANAN</small><b>${esc(o.orderNo)}</b></div>
                        <div style="font-size: 10px;">
                            <div>Tgl: ${new Date(o.createdAt).toLocaleString('id-ID')}</div>
                            <div>Pemesan: ${esc(o.name)}</div>
                            <div>Metode: ${esc(o.method)}</div>
                            ${o.phone ? `<div>WA: ${esc(o.phone)}</div>` : ''}
                            ${o.pickupPoint ? `<div>Jemput: ${esc(o.pickupPoint)}</div>` : ''}
                        </div>
                        <div class="line"></div>
                        <div>${itemsHtml}</div>
                        ${o.shipping ? `<div class="row"><span class="nm">Ongkir</span><span class="pr">${rp(o.shipping)}</span></div>` : ''}
                        <div class="line"></div>
                        <div class="row total">
                            <span class="nm">Total</span>
                            <span class="pr">${rp(o.total)}</span>
                        </div>
                        <div class="line"></div>
                        <div class="center" style="font-size: 12px; margin-top: 0; margin-bottom: 5px;">
                            Terima Kasih!<br>Simpan struk ini sebagai bukti klaim.
                        </div>
                        <script>
                            window.onload = function() {
                                window.print();
                                window.close();
                            }
                        <\/script>
                    </body>
                    </html>
                `);
                printWindow.document.close();
            }
        });

        $('orders-list').addEventListener('click', async (e) => {
            const btn = e.target.closest('button[data-no]');
            if (!btn) return;
            const o = orders.find(x => x.orderNo === btn.dataset.no);
            if (!o) return;

            if (btn.dataset.i === 'del') {
                if (confirm('Hapus pesanan ' + o.orderNo + ' secara permanen?')) await remove(ref(db, 'orders/' + o.orderNo));
                return;
            }
            const a = actions(o)[Number(btn.dataset.i)];
            if (!a) return;
            if (a.confirm && !confirm(a.confirm)) return;
            const extra = { ...(a.extra || {}) };
            if (a.reason) {
                const r = prompt('Alasan menolak:');
                if (r === null) return;
                extra.rejectReason = r.trim().slice(0, 120) || 'Maaf, pesanan tidak bisa diproses.';
            }
            try {
                await update(ref(db, 'orders/' + o.orderNo), { status: a.next, updatedAt: Date.now(), ...extra });
            } catch (err) {
                alert('Gagal: ' + err.message);
            }
        });

        $('btn-clear').addEventListener('click', async () => {
            const done = orders.filter(o => FINAL.includes(o.status));
            if (!done.length) return;
            if (!confirm('Hapus semua pesanan selesai?')) return;
            const updates = {};
            done.forEach(o => { updates[o.orderNo] = null; });
            try { await update(ref(db, 'orders'), updates); } catch (err) { alert('Gagal menghapus: ' + err.message); }
        });

        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            filter = t.dataset.filter;
            render();
        }));

        function startListeners() {
            unsubs.forEach(f => f()); unsubs = [];
            unsubs.push(onValue(statusRef, (snapshot) => {
                const data = snapshot.val();
                const badge = $('status-badge');
                if (data && data.isOpen) {
                    badge.innerText = "TOKO BUKA (OPEN)";
                    badge.style.background = "#e8f5e9"; badge.style.color = "#26971b";
                } else {
                    badge.innerText = "TOKO TUTUP (CLOSE)";
                    badge.style.background = "#ffebee"; badge.style.color = "#d70032";
                }
            }));
            unsubs.push(onValue(ref(db, 'feedback'), (snapshot) => {
                const v = snapshot.val() || {};
                feedbacks = Object.entries(v).map(([id, f]) => ({ id, ...f })).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
                renderFeedback();
            }, (err) => {
                $('feedback-list').innerHTML = '<div class="empty">Gagal memuat saran: ' + esc(err.message) + '</div>';
            }));
            unsubs.push(onValue(ref(db, 'orders'), (snapshot) => {
                orders = Object.values(snapshot.val() || {}).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                render();
            }, (err) => {
                $('orders-list').innerHTML = '<div class="empty">Gagal memuat pesanan: ' + esc(err.message) + '</div>';
                if (/permission/i.test(err.message || '')) {
                    $('login-msg').innerText = 'Akun ini tidak punya akses admin.';
                    signOut(auth);
                }
            }));
        }

        onAuthStateChanged(auth, (u) => {
            unsubs.forEach(f => f()); unsubs = [];
            $('dashboard-section').classList.toggle('hidden', !u);
            $('login-section').classList.toggle('hidden', !!u);
            if (u) startListeners();
        });
    </script>
</body>
</html>
